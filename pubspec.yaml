name: tulong_app
description: T.U.L.O.N.G - Transmission Unit for Local Offline Network Generation
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  provider: ^6.1.1
  animations: ^2.0.8
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  lottie: ^3.1.2
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  glassmorphism: ^3.0.0
  flutter_animate: ^4.5.0
  confetti: ^0.8.0
  http: ^1.1.0
  animated_text_kit: ^4.2.2
  flutter_staggered_grid_view: ^0.7.0
  simple_animations: ^5.0.2
  fl_chart: ^0.66.2
  url_launcher: ^6.3.2
  
  # Firebase dependencies
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  firebase_database: ^12.0.2
  firebase_storage: ^13.0.2
  firebase_analytics: ^12.0.2
  firebase_messaging: ^16.0.2
  google_sign_in: ^6.2.1
  
  # Notification dependencies
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1

  # Connectivity and offline dependencies
  connectivity_plus: ^6.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  internet_connection_checker: ^3.0.1
  crypto: ^3.0.6
  local_auth: ^2.3.0
  
  # Hardware communication dependencies
  permission_handler: ^11.0.1
  flutter_bluetooth_serial_plus: ^0.5.1
  
  # Voice/Audio dependencies
  flutter_sound: ^9.2.13
  audioplayers: ^6.1.0
  path_provider: ^2.1.1
  
  # Camera and Image Processing dependencies
  camera: ^0.10.5+5
  image: ^4.1.3
  
  # ML Model dependencies
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/lottie/
    - assets/gifs/disasters/
    - assets/philippine_provinces_cities_municipalities_and_barangays_2019v2.json
    - assets/medic_damage_severity_model.keras.tflite

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_logo (3).png"
  min_sdk_android: 21
  # Remove adaptive icons to preserve shield shape
  adaptive_icon_background: null
  adaptive_icon_foreground: null
  web:
    generate: true
    image_path: "assets/images/app_logo (3).png"
    background_color: "#FFFFFF"
    theme_color: "#FF0000"
  windows:
    generate: true
    image_path: "assets/images/app_logo (3).png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/app_logo (3).png"
